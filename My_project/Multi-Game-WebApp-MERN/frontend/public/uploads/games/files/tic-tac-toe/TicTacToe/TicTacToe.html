<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .mode-selection {
            text-align: center;
            margin-bottom: 30px;
        }

        .mode-selection h2 {
            color: #555;
            margin-bottom: 20px;
            font-size: 1.3em;
        }

        .mode-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .mode-btn {
            padding: 15px 30px;
            font-size: 1.1em;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .mode-btn.pvp {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .mode-btn.pvc {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .mode-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }

        .game-info {
            display: none;
            margin-bottom: 25px;
        }

        .scoreboard {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .score {
            text-align: center;
        }

        .score-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }

        .score-value {
            font-size: 1.8em;
            font-weight: bold;
        }

        .score.player-x .score-value {
            color: #667eea;
        }

        .score.player-o .score-value {
            color: #f5576c;
        }

        .current-turn {
            text-align: center;
            font-size: 1.3em;
            font-weight: bold;
            color: #764ba2;
            margin-bottom: 20px;
            padding: 10px;
            background: #fff3cd;
            border-radius: 8px;
        }

        .board {
            display: none;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
            aspect-ratio: 1;
        }

        .cell {
            background: #f8f9fa;
            border: none;
            border-radius: 10px;
            font-size: 3em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .cell:hover:not(:disabled) {
            background: #e9ecef;
            transform: scale(1.05);
        }

        .cell:disabled {
            cursor: not-allowed;
        }

        .cell.x {
            color: #667eea;
        }

        .cell.o {
            color: #f5576c;
        }

        .cell.winner {
            background: #ffd700 !important;
            animation: pulse 0.5s ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .controls {
            display: none;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 25px;
            font-size: 1em;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
        }

        .btn-reset {
            background: #6c757d;
        }

        .btn-reset:hover {
            background: #5a6268;
        }

        .btn-menu {
            background: #9b59b6;
        }

        .btn-menu:hover {
            background: #8e44ad;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            animation: modalSlideIn 0.3s ease-out;
        }

        @keyframes modalSlideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-content h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 2em;
        }

        .modal-content button {
            padding: 12px 30px;
            font-size: 1.1em;
            margin: 10px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2em;
            }

            .cell {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 TIC TAC TOE</h1>

        <!-- Mode Selection -->
        <div class="mode-selection" id="modeSelection">
            <h2>Choose Game Mode</h2>
            <div class="mode-buttons">
                <button class="mode-btn pvp" onclick="startGame('pvp')">👥 Player vs Player</button>
                <button class="mode-btn pvc" onclick="startGame('pvc')">🤖 Player vs Computer</button>
            </div>
        </div>

        <!-- Game Info -->
        <div class="game-info" id="gameInfo">
            <div class="scoreboard">
                <div class="score player-x">
                    <div class="score-label">Player X</div>
                    <div class="score-value" id="scoreX">0</div>
                </div>
                <div class="score player-o">
                    <div class="score-label">Player O</div>
                    <div class="score-value" id="scoreO">0</div>
                </div>
            </div>
            <div class="current-turn" id="currentTurn">Player X's Turn</div>
        </div>

        <!-- Game Board -->
        <div class="board" id="board">
            <button class="cell" onclick="makeMove(0)"></button>
            <button class="cell" onclick="makeMove(1)"></button>
            <button class="cell" onclick="makeMove(2)"></button>
            <button class="cell" onclick="makeMove(3)"></button>
            <button class="cell" onclick="makeMove(4)"></button>
            <button class="cell" onclick="makeMove(5)"></button>
            <button class="cell" onclick="makeMove(6)"></button>
            <button class="cell" onclick="makeMove(7)"></button>
            <button class="cell" onclick="makeMove(8)"></button>
        </div>

        <!-- Controls -->
        <div class="controls" id="controls">
            <button class="btn btn-reset" onclick="resetGame()">🔄 Reset Game</button>
            <button class="btn btn-menu" onclick="backToMenu()">🏠 Main Menu</button>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h2 id="modalMessage"></h2>
            <button class="btn btn-reset" onclick="closeModal()">Play Again</button>
            <button class="btn btn-menu" onclick="closeModalAndMenu()">Main Menu</button>
        </div>
    </div>

    <script>
        let board = Array(9).fill('');
        let currentPlayer = 'X';
        let gameMode = null;
        let scoreX = 0;
        let scoreO = 0;
        let gameActive = false;

        const winningCombinations = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
            [0, 4, 8], [2, 4, 6]              // Diagonals
        ];

        function startGame(mode) {
            gameMode = mode;
            gameActive = true;
            document.getElementById('modeSelection').style.display = 'none';
            document.getElementById('gameInfo').style.display = 'block';
            document.getElementById('board').style.display = 'grid';
            document.getElementById('controls').style.display = 'flex';
            resetGame();
        }

        function makeMove(index) {
            if (!gameActive || board[index] !== '' || checkWinner()) return;

            const cells = document.querySelectorAll('.cell');
            board[index] = currentPlayer;
            cells[index].textContent = currentPlayer;
            cells[index].classList.add(currentPlayer.toLowerCase());
            cells[index].disabled = true;

            if (checkWinner()) {
                const winner = currentPlayer;
                highlightWinner();
                setTimeout(() => {
                    showModal(`Player ${winner} Wins! 🎉`);
                    if (winner === 'X') scoreX++;
                    else scoreO++;
                    updateScores();
                }, 500);
                gameActive = false;
                return;
            }

            if (!board.includes('')) {
                setTimeout(() => showModal("It's a Draw! 🤝"), 500);
                gameActive = false;
                return;
            }

            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            updateTurnDisplay();

            if (gameMode === 'pvc' && currentPlayer === 'O' && gameActive) {
                setTimeout(computerMove, 500);
            }
        }

        function computerMove() {
            if (!gameActive) return;

            // Check if computer can win
            let move = findWinningMove('O');
            if (move !== null) {
                makeMove(move);
                return;
            }

            // Block player from winning
            move = findWinningMove('X');
            if (move !== null) {
                makeMove(move);
                return;
            }

            // Take center
            if (board[4] === '') {
                makeMove(4);
                return;
            }

            // Take a corner
            const corners = [0, 2, 6, 8];
            const availableCorners = corners.filter(i => board[i] === '');
            if (availableCorners.length > 0) {
                makeMove(availableCorners[Math.floor(Math.random() * availableCorners.length)]);
                return;
            }

            // Take any available space
            const available = board.map((cell, idx) => cell === '' ? idx : null).filter(idx => idx !== null);
            if (available.length > 0) {
                makeMove(available[Math.floor(Math.random() * available.length)]);
            }
        }

        function findWinningMove(player) {
            for (let combo of winningCombinations) {
                const values = combo.map(i => board[i]);
                if (values.filter(v => v === player).length === 2 && values.includes('')) {
                    return combo[values.indexOf('')];
                }
            }
            return null;
        }

        function checkWinner() {
            return winningCombinations.some(combo => {
                return board[combo[0]] !== '' &&
                       board[combo[0]] === board[combo[1]] &&
                       board[combo[1]] === board[combo[2]];
            });
        }

        function highlightWinner() {
            const cells = document.querySelectorAll('.cell');
            winningCombinations.forEach(combo => {
                if (board[combo[0]] !== '' &&
                    board[combo[0]] === board[combo[1]] &&
                    board[combo[1]] === board[combo[2]]) {
                    combo.forEach(idx => cells[idx].classList.add('winner'));
                }
            });
        }

        function updateTurnDisplay() {
            document.getElementById('currentTurn').textContent = `Player ${currentPlayer}'s Turn`;
        }

        function updateScores() {
            document.getElementById('scoreX').textContent = scoreX;
            document.getElementById('scoreO').textContent = scoreO;
        }

        function resetGame() {
            board = Array(9).fill('');
            currentPlayer = 'X';
            gameActive = true;
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => {
                cell.textContent = '';
                cell.disabled = false;
                cell.className = 'cell';
            });
            updateTurnDisplay();
        }

        function backToMenu() {
            scoreX = 0;
            scoreO = 0;
            updateScores();
            document.getElementById('modeSelection').style.display = 'block';
            document.getElementById('gameInfo').style.display = 'none';
            document.getElementById('board').style.display = 'none';
            document.getElementById('controls').style.display = 'none';
            resetGame();
        }

        function showModal(message) {
            document.getElementById('modalMessage').textContent = message;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            resetGame();
        }

        function closeModalAndMenu() {
            document.getElementById('modal').style.display = 'none';
            backToMenu();
        }
    </script>
</body>
</html>
